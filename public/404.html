<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Luke Solomon</title>
    <script>
      // gh-pages SPA fallback: redirect 404s to index.html with the path encoded in the query string,
      // then index.html restores the URL before React mounts.
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
